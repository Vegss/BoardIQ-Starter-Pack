services:
  my-prototype:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      WATCHPACK_POLLING: "true"
      MIGRATIONS_DIR: /supabase/migrations
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - ./supabase:/supabase:ro
    # The mounted node_modules volume persists between rebuilds. Refresh it before
    # development starts so package changes made during a workshop take effect.
    command: sh -c 'npm install && npm run dev -- --hostname 0.0.0.0'
